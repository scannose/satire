<!DOCTYPE html>
<html>
  <head>
    <title>satire clicker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="topbar">
      <button id="tab1"></button>
      <button id="tab2" hidden="true"></button>
      <button id="tabOptions"></buttion>
    </div>
    <div id="main">
      <div id="dimensions">
        <p id="satirePoints"></p>
        <div id="toolbar">
          <button id="bulk"></button>
        </div>
        <div id="dim1" class="dim">
          <p id="dim1_display" class="dimdisplay"></p>
          <p id="dim1_desc" class="dimdesc"></p>
          <button id="dim1_buy"></button>
        </div>
        <div id="dim2" class="dim">
          <p id="dim2_display" class="dimdisplay"></p>
          <p id="dim2_desc" class="dimdesc"></p>
          <button id="dim2_buy"></button>
        </div>
        <div id="dim3" class="dim" hidden="true">
          <p id="dim3_display" class="dimdisplay"></p>
          <p id="dim3_desc" class="dimdesc"></p>
          <button id="dim3_buy"></button>
        </div>
        <div id="dim4" class="dim" hidden="true">
          <p id="dim4_display" class="dimdisplay"></p>
          <p id="dim4_desc" class="dimdesc"></p>
          <button id="dim4_buy"></button>
        </div>
        <div id="dim5" class="dim" hidden="true">
          <p id="dim5_display" class="dimdisplay"></p>
          <p id="dim5_desc" class="dimdesc"></p>
          <button id="dim5_buy"></button>
        </div>
        <div id="dim6" class="dim" hidden="true">
          <p id="dim6_display" class="dimdisplay"></p>
          <p id="dim6_desc" class="dimdesc"></p>
          <button id="dim6_buy"></button>
        </div>
        <div id="dim7" class="dim" hidden="true">
          <p id="dim7_display" class="dimdisplay"></p>
          <p id="dim7_desc" class="dimdesc"></p>
          <button id="dim7_buy"></button>
        </div>
        <div id="dim8" class="dim" hidden="true">
          <p id="dim8_display" class="dimdisplay"></p>
          <p id="dim8_desc" class="dimdesc"></p>
          <button id="dim8_buy"></button>
        </div>
        <div id="dim9" class="dim" hidden="true">
          <p id="dim9_display" class="dimdisplay"></p>
          <p id="dim9_desc" class="dimdesc"></p>
          <button id="dim9_buy"></button>
        </div>
      </div>
      <div id="dimupgrades" hidden="true">
        <p id="dimboosts"></p>
        <p id="dimboost_desc"></p>
        <div id="dimboost_upgrades">
          <div id="dbupg1" class="dbupg">
            <p id="dbupg1_desc"></p>
            <button id="dbupg1_buy"></button>
          </div>
          <div id="dbupg2" class="dbupg">
            <p id="dbupg2_desc"></p>
            <button id="dbupg2_buy"></button>
          </div>
          <div id="dbupg3" class="dbupg">
            <p id="dbupg3_desc"></p>
            <button id="dbupg3_buy"></button>
          </div>
          <div id="dbupg4" class="dbupg">
            <p id="dbupg4_desc"></p>
            <button id="dbupg4_buy"></button>
          </div>
        </div>
        <div id="infinity" hidden="true">
          <p id="infinity_display" hidden="true"></p>
          <p id="infinity_desc"></p>
          <button id="infinity_reset"></button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/break_infinity.js@2"></script>
  </body>
</html>
